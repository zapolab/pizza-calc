<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!-- Blocking: the theme must land before the first paint. Mirrors src/lib/theme.ts. -->
		<script>
			try {
				const stored = localStorage.getItem('theme');
				const choice = stored === 'light' || stored === 'dark' ? stored : 'auto';
				document.documentElement.classList.toggle(
					'dark',
					choice === 'dark' ||
						(choice === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)
				);
			} catch {
				/* storage blocked: fall back to the light default */
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
